<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emmanuel — Clôture de Caisse</title>
  <style>
    :root {
      --primary: #0E5C8C;
      --secondary: #1E9E63;
      --danger: #D9392B;
      --bg: #F3F6FA;
      --ink: #12212E;
      --muted: #5C6B7A;
      --line: #DCE3EC;
      --r: 18px;
      --font: "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font); background: #DCE3EC; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .frame { width: 360px; height: 800px; background: var(--bg); display: flex; flex-direction: column; border-radius: 26px; box-shadow: 0 8px 22px rgba(18,33,46,.14); overflow: hidden; }
    .topbar { background: var(--primary); color: #fff; min-height: 66px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; }
    .tb-title { font-size: 19px; font-weight: 900; }
    .screen { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .card { background: #fff; border-radius: 14px; padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 8px rgba(18,33,46,.08); }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; }
    .field input { padding: 10px; border-radius: 8px; border: 2px solid var(--line); font-size: 16px; font-weight: 900; text-align: center; }
    .btn-submit { background: var(--secondary); color: #fff; border: 0; border-radius: 12px; padding: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 14px; }
    .box-res { border-radius: 12px; padding: 12px; text-align: center; font-weight: 900; }
    .box-ok { background: #E2F5EB; color: #0F5C38; border: 1px solid #9AD9B8; }
    .box-err { background: #FCE9E7; color: #9E2418; border: 1px solid #F0A79E; }
    .btn-back { min-height: 52px; border: 0; border-radius: var(--r); font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none; text-transform: uppercase; background: var(--primary); color: #fff; }
    .actionbar { background: #fff; border-top: 2px solid var(--line); padding: 12px; }
  </style>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div>
        <div class="tb-title">Clôture de Caisse</div>
        <div style="font-size: 12.5px; opacity: .85;">{{ user.nom_complet }} ({{ user.role_label }})</div>
      </div>
    </header>

    <div class="screen">
      {% if message %}
        <div class="box-res box-ok">
          {{ message }}
        </div>
      {% endif %}

      <div class="card">
        <div style="font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; text-align: center;">Recette Attendue selon le système</div>
        <div style="font-size: 28px; font-weight: 900; color: var(--primary); text-align: center;">
          {{ "{:,.0f}".format(total_attendu).replace(',', ' ') }} FC
        </div>

        <form action="/cloture/valider" method="POST" style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px;">
          <div class="field">
            <label>Montant Physique en Caisse (FC)</label>
            <input type="number" name="montant_compte" placeholder="Ex: 50000" required autofocus>
          </div>
          <button type="submit" class="btn-submit">VALIDER LA CLÔTURE DU SERVICE</button>
        </form>
      </div>
    </div>

    <div class="actionbar">
      <a href="/logout" class="btn-back" style="background: var(--danger);">SE DÉCONNECTER</a>
    </div>
  </div>
</body>
</html>
