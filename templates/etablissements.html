<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emmanuel — Établissements</title>
  <style>
    :root {
      --primary: #0E5C8C;
      --secondary: #1E9E63;
      --danger: #D9392B;
      --bg: #121A21;
      --card-bg: #1C2732;
      --ink: #FFFFFF;
      --muted: #8E9BAE;
      --line: #2A3847;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: #0A1118; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .container { flex: 1; padding: 16px; width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
    .field input { padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: #121A21; color: #fff; font-size: 14px; }
    .btn-submit { background: var(--primary); color: #fff; border: 0; border-radius: 10px; height: 46px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
    .row-site { background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .btn-back { background: var(--primary); color: #fff; border-radius: 12px; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 900; text-transform: uppercase; }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="font-size: 18px; font-weight: 900;">Gestion des Établissements</div>
    <div style="font-size: 12px; color: var(--muted);">Sites du Réseau Emmanuel</div>
  </header>

  <main class="container">
    <div style="font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase;">AJOUTER UN NOUVEAU SITE</div>
    <form action="/etablissements/creer" method="POST" class="card">
      <div class="field">
        <label>Nom de l'établissement</label>
        <input type="text" name="nom" required placeholder="ex: Emmanuel - Bandal, Tchangu...">
      </div>
      <button type="submit" class="btn-submit">ENREGISTRER LE SITE</button>
    </form>

    <div style="font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; margin-top: 8px;">ÉTABLISSEMENTS ACTIFS</div>
    {% for site in etablissements %}
      <div class="row-site">
        <div>
          <div style="font-weight: 900; font-size: 15px;">{{ site.nom }}</div>
          <div style="font-size: 11px; color: #32D785; font-weight: 800; margin-top: 2px;">● Opérationnel</div>
        </div>
      </div>
    {% endfor %}

    <a href="/dashboard" class="btn-back" style="margin-top: 10px;">RETOUR TABLEAU DE BORD</a>
  </main>
</body>
</html>
