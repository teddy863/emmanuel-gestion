<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emmanuel — Établissements</title>
 <style>
  :root {
    --bg-dark: #121A21;
    --card-bg: #1C2732;
    --primary: #0E5C8C;
    --text: #FFFFFF;
    --muted: #8E9BAE;
    --line: #2A3847;
  }
  
  /* Supression de toutes les marges et cadres smartphone artificiels */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100vw;
    min-height: 100vh;
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
    overflow-y: auto; /* Permet de défiler vers le bas normalement */
  }

  /* Conteneur fluide occupant 100% du téléphone */
  .app-container {
    width: 100%;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Les menus déroulants restent dans le cadre */
  select, input {
    width: 100%;
    max-width: 100%;
    padding: 12px;
    background: #121A21;
    color: #FFF;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
  }
</style>
</head>
<body>
  <header class="topbar">
    <div style="font-size: 18px; font-weight: 900;">Gestion des Établissements</div>
    <div style="font-size: 12px; color: var(--muted);">Sites du Réseau Emmanuel</div>
  </header>

  <main class="container">
    <div style="font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase;">AJOUTER UN NOUVEAU SITE</div>
    <form action="/etablissements/creer" method="POST" class="card">
      <div class="field">
        <label>Nom de l'établissement</label>
        <input type="text" name="nom" required placeholder="ex: Emmanuel - Bandal, Tchangu...">
      </div>
      <button type="submit" class="btn-submit">ENREGISTRER LE SITE</button>
    </form>

    <div style="font-size: 11px; font-weight: 900; color: var(--muted); text-transform: uppercase; margin-top: 8px;">ÉTABLISSEMENTS ACTIFS</div>
    {% for site in etablissements %}
      <div class="row-site">
        <div>
          <div style="font-weight: 900; font-size: 15px;">{{ site.nom }}</div>
          <div style="font-size: 11px; color: #32D785; font-weight: 800; margin-top: 2px;">● Opérationnel</div>
        </div>
      </div>
    {% endfor %}

    <a href="/dashboard" class="btn-back" style="margin-top: 10px;">RETOUR TABLEAU DE BORD</a>
  </main>
</body>
</html>
