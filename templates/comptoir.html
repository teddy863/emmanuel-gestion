<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emmanuel — Comptoir & Boissons</title>
  <style>
    :root {
      --bg-dark: #121A21;
      --card-bg: #1C2732;
      --primary: #0E5C8C;
      --secondary: #1E9E63;
      --danger: #D9392B;
      --text: #FFFFFF;
      --muted: #8E9BAE;
      --line: #2A3847;
      --r: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; min-height: 100vh; background: var(--bg-dark); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; overflow-y: auto; }
    .topbar { background: #0A1118; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card-item { background: var(--card-bg); border-radius: var(--r); padding: 12px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #FFF; }
    .card { background: var(--card-bg); border-radius: var(--r); padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    input { width: 100%; padding: 10px; background: #121A21; color: #FFF; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
    .btn-submit { background: var(--primary); color: #FFF; border: 0; border-radius: 8px; height: 42px; font-weight: 900; font-size: 12px; cursor: pointer; text-transform: uppercase; width: 100%; }
    .btn-nav { height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 900; text-transform: uppercase; color: #fff; width: 100%; }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="font-size: 18px; font-weight: 900;">Comptoir & Boissons</div>
    <div style="font-size: 12px; color: var(--muted);">Session : {{ user.nom_complet }}</div>
  </header>

  <main class="container">
    <div style="font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--muted);">1. Toucher pour vendre (1 bouteille)</div>
    <div class="grid-2">
      {% for p in produits %}
        <a href="/comptoir/vendre_une/{{ p.id }}" class="card-item">
          <div style="font-weight: 900; font-size: 14px;">{{ p.nom }}</div>
          <div style="font-size: 13px; color: #64B5F6; font-weight: 800;">{{ "{:,.0f}".format(p.prix_vente).replace(',', ' ') }} FC</div>
          <div style="font-size: 10px; color: #32D785;">Stock: {{ p.quantite_stock }} bout.</div>
        </a>
      {% endfor %}
    </div>

    <div style="font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--muted); margin-top: 8px;">2. Ajouter un Stock (Casier/Carton)</div>
    <form action="/comptoir/ajouter_stock" method="POST" class="card">
      <div>
        <label style="font-size: 10px; color: var(--muted); text-transform: uppercase;">Nom de la boisson</label>
        <input type="text" name="nom" required placeholder="ex: Mützig 65cl, Coca 33cl...">
      </div>
      <div class="grid-2">
        <div>
          <label style="font-size: 10px; color: var(--muted); text-transform: uppercase;">Nbr Bouteilles/Casier</label>
          <input type="number" name="unites_par_casier" value="12" required>
        </div>
        <div>
          <label style="font-size: 10px; color: var(--muted); text-transform: uppercase;">Nbr Casiers Achetés</label>
          <input type="number" name="nombre_casiers" value="1" required>
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label style="font-size: 10px; color: var(--muted); text-transform: uppercase;">Prix Achat Casier (FC)</label>
          <input type="number" name="prix_achat_casier" value="30000" required>
        </div>
        <div>
          <label style="font-size: 10px; color: var(--muted); text-transform: uppercase;">Prix Vente Bouteille (FC)</label>
          <input type="number" name="prix_vente_bouteille" value="3500" required>
        </div>
      </div>
      <button type="submit" class="btn-submit">Enregistrer le Casier</button>
    </form>

    <div class="grid-2" style="margin-top: 10px;">
      <a href="/cloture" class="btn-nav" style="background: var(--secondary);">Clôture Caisse</a>
      <a href="/logout" class="btn-nav" style="background: var(--danger);">Déconnexion</a>
    </div>
  </main>
</body>
</html>
