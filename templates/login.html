<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emmanuel — Connexion</title>
  <style>
    :root {
      --primary: #0E5C8C;
      --bg: #121A21;
      --card-bg: #1C2732;
      --ink: #FFFFFF;
      --muted: #8E9BAE;
      --line: #2A3847;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
    .login-card { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--line); padding: 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .avatar { width: 64px; height: 64px; background: var(--primary); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; }
    .pin-dots { display: flex; gap: 12px; margin: 8px 0; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); }
    .dot.active { background: var(--primary); border-color: var(--primary); }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
    .key { background: #121A21; border: 1px solid var(--line); border-radius: 12px; height: 54px; font-size: 20px; font-weight: 800; color: #FFF; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .key:active { background: var(--primary); }
    .btn-submit { background: var(--primary); color: #FFF; border: 0; border-radius: 12px; height: 50px; width: 100%; font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="avatar">E</div>
    <h2 style="font-size: 22px; font-weight: 900;">Emmanuel</h2>
    <p style="font-size: 13px; color: var(--muted);">Entrez votre code à 4 chiffres</p>
    
    <form action="/login" method="POST" style="width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center;">
      <input type="hidden" name="pin" id="pin-input" required>
      
      <div class="pin-dots">
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
      </div>

      <div class="keypad">
        <div class="key" onclick="press('1')">1</div>
        <div class="key" onclick="press('2')">2</div>
        <div class="key" onclick="press('3')">3</div>
        <div class="key" onclick="press('4')">4</div>
        <div class="key" onclick="press('5')">5</div>
        <div class="key" onclick="press('6')">6</div>
        <div class="key" onclick="press('7')">7</div>
        <div class="key" onclick="press('8')">8</div>
        <div class="key" onclick="press('9')">9</div>
        <div class="key" style="font-size: 12px;" onclick="clearPin()">Effacer</div>
        <div class="key" onclick="press('0')">0</div>
        <div class="key" style="font-size: 14px;" onclick="backspace()">⌫</div>
      </div>

      <button type="submit" class="btn-submit">OUVRIR LA SESSION</button>
    </form>
  </div>

  <script>
    let currentPin = "";
    function press(n) {
      if (currentPin.length < 4) {
        currentPin += n;
        updateDots();
      }
    }
    function clearPin() { currentPin = ""; updateDots(); }
    function backspace() { currentPin = currentPin.slice(0, -1); updateDots(); }
    function updateDots() {
      document.getElementById('pin-input').value = currentPin;
      for (let i = 1; i <= 4; i++) {
        document.getElementById('d' + i).classList.toggle('active', i <= currentPin.length);
      }
    }
  </script>
</body>
</html>
