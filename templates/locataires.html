<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emmanuel — Locataires</title>
  <style>
    :root {
      --bg-dark: #121A21;
      --card-bg: #1C2732;
      --primary: #0E5C8C;
      --secondary: #1E9E63;
      --danger: #D9392B;
      --text: #FFFFFF;
      --muted: #8E9BAE;
      --line: #2A3847;
      --r: 12px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .topbar {
      background: #0A1118;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--r);
      padding: 14px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }

    select, input {
      width: 100%;
      padding: 12px;
      background: #121A21;
      color: #FFF;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 10px;
      height: 48px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-back {
      background: var(--card-bg);
      border: 1px solid var(--line);
      color: #fff;
      border-radius: 10px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 900;
      text-transform: uppercase;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div style="font-size: 18px; font-weight: 900;">Gestion des Locataires</div>
    <div style="font-size: 12px; color: var(--muted);">Baux & Loyers mensuels</div>
  </header>

  <main class="app-container">
    <div style="font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--muted);">Ajouter un Locataire</div>
    
    <form action="/locataires/ajouter" method="POST" class="card">
      <div class="field">
        <label>Nom complet du locataire</label>
        <input type="text" name="nom_complet" required placeholder="ex: Mulamba Patrick">
      </div>
      <div class="field">
        <label>Local / Localisation</label>
        <input type="text" name="local" required placeholder="ex: Boutique N° 3">
      </div>
      <div class="field">
        <label>Loyer Mensuel ($ ou FC)</label>
        <input type="number" name="loyer_mensuel" required placeholder="150">
      </div>
      <button type="submit" class="btn-submit">ENREGISTRER LE LOCATAIRE</button>
    </form>

    <div style="font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--muted); margin-top: 8px;">Liste des Locataires</div>
    
    {% for l in locataires %}
      <div class="card">
        <div style="display: flex; justify-content: space-between; font-weight: 900;">
          <span style="color: #64B5F6;">{{ l.nom_complet }}</span>
          <span style="color: var(--secondary);">{{ l.local }}</span>
        </div>
        <div style="font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px;">
          Loyer: <b>{{ l.loyer_mensuel }}</b>
        </div>
      </div>
    {% else %}
      <div class="card" style="text-align: center; color: var(--muted); font-size: 13px;">
        Aucun locataire enregistré.
      </div>
    {% endfor %}

    <a href="/dashboard" class="btn-back">RETOUR AU TABLEAU DE BORD</a>
  </main>

</body>
</html>
